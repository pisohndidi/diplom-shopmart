<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopMart - Интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">Shop<span>Mart</span></a>
      <nav>
        <a href="index.html" class="active">Каталог</a>
        <a href="cart.html">Корзина</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-btn">
          🛒 Корзина
          <span class="cart-count" id="cart-count" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-tag">Новая коллекция 2026</div>
      <h1>Всё, что нужно — в одном месте</h1>
      <p>Электроника, книги, одежда и спорттовары с быстрой доставкой по России</p>
      <a href="#catalog" class="hero-btn">Смотреть каталог</a>
    </div>
  </section>

  <!-- FILTERS -->
  <div class="container" id="catalog">
    <section class="filters-section">
      <div class="filters-label">Категории</div>
      <div class="filter-tags" id="filter-tags">
        <!-- Рендерится через JS -->
      </div>
    </section>

    <!-- PRODUCTS -->
    <section class="products-section">
      <div class="section-header">
        <h2 class="section-title">Каталог товаров</h2>
        <span class="products-count" id="products-count"></span>
      </div>
      <div class="products-grid" id="products-grid">
        <!-- Рендерится через JS -->
      </div>
    </section>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 ShopMart. Учебный проект - УП.02, специальность 09.02.07.</p>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
  <script>
    let activeCategory = 0;

    function renderFilters() {
      const container = document.getElementById('filter-tags');
      container.innerHTML = CATEGORIES.map(cat => `
        <button class="filter-tag ${cat.id === activeCategory ? 'active' : ''}"
                onclick="setCategory(${cat.id})">
          ${cat.name}
        </button>
      `).join('');
    }

    function setCategory(id) {
      activeCategory = id;
      renderFilters();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      const countEl = document.getElementById('products-count');

      const filtered = activeCategory === 0
        ? PRODUCTS
        : PRODUCTS.filter(p => p.category_id === activeCategory);

      countEl.textContent = `${filtered.length} товар${filtered.length === 1 ? '' : filtered.length < 5 ? 'а' : 'ов'}`;

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color:var(--gray);padding:40px 0">Нет товаров в этой категории.</p>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <article class="product-card">
          <a href="product.html?id=${p.id}">
            <div class="product-img">
              ${p.emoji}
              ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
            </div>
            <div class="product-info">
              <div class="product-category">${p.category}</div>
              <div class="product-name">${p.name}</div>
              <div class="product-desc">${p.desc}</div>
              <div class="product-footer">
                <span class="product-price">${formatPrice(p.price)}</span>
                <span class="product-stock">В наличии</span>
              </div>
            </div>
          </a>
        </article>
      `).join('');
    }

    renderFilters();
    renderProducts();
  </script>
</body>
</html>
