<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина - ShopMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">Shop<span>Mart</span></a>
      <nav>
        <a href="index.html">Каталог</a>
        <a href="cart.html" class="active">Корзина</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-btn">
          🛒 Корзина
          <span class="cart-count" id="cart-count" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- CART -->
  <main class="container">
    <section class="cart-section">
      <h1 class="cart-title">Корзина</h1>

      <div id="cart-content">
        <!-- Рендерится через JS -->
      </div>

      <!-- SUCCESS -->
      <div class="success-msg" id="success-msg">
        <div class="success-icon">🎉</div>
        <h2>Заказ оформлен!</h2>
        <p>Мы свяжемся с вами в течение 30 минут для подтверждения.</p>
        <a href="index.html" style="display:inline-block;margin-top:20px;color:var(--accent);font-weight:500">
          ← Вернуться в каталог
        </a>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 ShopMart. Учебный проект - УП.02, специальность 09.02.07.</p>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
  <script>
    function renderCart() {
      const items = Cart.getItems();
      const container = document.getElementById('cart-content');

      if (items.length === 0) {
        container.innerHTML = `
          <div class="cart-empty">
            <div class="cart-empty-icon">🛒</div>
            <h2>Корзина пуста</h2>
            <p>Добавьте товары из каталога</p>
            <a href="index.html" class="hero-btn" style="display:inline-block;margin-top:24px">
              Перейти в каталог
            </a>
          </div>`;
        return;
      }

      const itemsHtml = items.map(item => {
        const p = PRODUCTS.find(p => p.id === item.id);
        if (!p) return '';
        return `
          <div class="cart-item" id="cart-item-${p.id}">
            <a href="product.html?id=${p.id}" class="cart-item-img">${p.emoji}</a>
            <div>
              <div class="cart-item-name">${p.name}</div>
              <div class="cart-item-cat">${p.category}</div>
              <div class="cart-item-qty">
                <button onclick="updateQty(${p.id}, ${item.qty - 1})">−</button>
                <span>${item.qty} шт.</span>
                <button onclick="updateQty(${p.id}, ${item.qty + 1})">+</button>
              </div>
            </div>
            <div class="cart-item-right">
              <div class="cart-item-price">${formatPrice(p.price * item.qty)}</div>
              <button class="remove-btn" onclick="removeItem(${p.id})">Удалить</button>
            </div>
          </div>`;
      }).join('');

      const total = Cart.total();
      const delivery = total >= 3000 ? 0 : 350;
      const finalTotal = total + delivery;

      container.innerHTML = `
        <div class="cart-grid">
          <div>
            <div id="cart-items">${itemsHtml}</div>

            <!-- ФОРМА ЗАКАЗА -->
            <div class="order-form-section">
              <h2 class="form-title">Оформление заказа</h2>
              <form id="order-form" novalidate>
                <div class="form-grid">
                  <div class="form-group">
                    <label class="form-label" for="fname">Имя *</label>
                    <input class="form-input" type="text" id="fname" placeholder="Иван" autocomplete="given-name">
                    <span class="field-error" id="err-fname"></span>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="lname">Фамилия *</label>
                    <input class="form-input" type="text" id="lname" placeholder="Петров" autocomplete="family-name">
                    <span class="field-error" id="err-lname"></span>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="email">E-mail *</label>
                    <input class="form-input" type="email" id="email" placeholder="ivan@mail.ru" autocomplete="email">
                    <span class="field-error" id="err-email"></span>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="phone">Телефон *</label>
                    <input class="form-input" type="tel" id="phone" placeholder="+7 (___) ___-__-__" autocomplete="tel">
                    <span class="field-error" id="err-phone"></span>
                  </div>
                  <div class="form-group full">
                    <label class="form-label" for="address">Адрес доставки *</label>
                    <input class="form-input" type="text" id="address" placeholder="г. Москва, ул. Ленина, д. 1, кв. 10" autocomplete="street-address">
                    <span class="field-error" id="err-address"></span>
                  </div>
                  <div class="form-group full">
                    <label class="form-label" for="comment">Комментарий к заказу</label>
                    <input class="form-input" type="text" id="comment" placeholder="Позвонить за час до доставки...">
                  </div>
                </div>
                <button class="submit-btn" type="submit" id="submit-btn">
                  Оформить заказ на ${formatPrice(finalTotal)}
                </button>
              </form>
            </div>
          </div>

          <!-- ИТОГО -->
          <div>
            <div class="order-summary">
              <div class="order-summary-title">Ваш заказ</div>
              ${items.map(item => {
                const p = PRODUCTS.find(p => p.id === item.id);
                return p ? `<div class="summary-row"><span>${p.name} × ${item.qty}</span><span>${formatPrice(p.price * item.qty)}</span></div>` : '';
              }).join('')}
              <div class="summary-row">
                <span>Доставка</span>
                <span>${delivery === 0 ? 'Бесплатно' : formatPrice(delivery)}</span>
              </div>
              ${delivery === 0 ? '<div style="font-size:11px;color:rgba(248,245,240,0.5);margin-bottom:8px">Бесплатно при заказе от 3 000 ₽</div>' : ''}
              <div class="summary-total">
                <span>Итого</span>
                <span>${formatPrice(finalTotal)}</span>
              </div>
            </div>
          </div>
        </div>`;

      // Навешиваем обработчик формы после рендера
      document.getElementById('order-form').addEventListener('submit', handleSubmit);
    }

    function updateQty(productId, newQty) {
      const product = PRODUCTS.find(p => p.id === productId);
      if (newQty < 1) { removeItem(productId); return; }
      if (newQty > product.stock) { showToast('Больше нет в наличии', '⚠️'); return; }
      Cart.setQty(productId, newQty);
      renderCart();
    }

    function removeItem(productId) {
      const p = PRODUCTS.find(p => p.id === productId);
      Cart.remove(productId);
      showToast(`«${p.name}» удалён из корзины`, '🗑️');
      renderCart();
    }

    // ── ВАЛИДАЦИЯ ──
    const validators = {
      fname:   v => v.trim().length >= 2  ? '' : 'Введите имя (минимум 2 символа)',
      lname:   v => v.trim().length >= 2  ? '' : 'Введите фамилию (минимум 2 символа)',
      email:   v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? '' : 'Введите корректный e-mail',
      phone:   v => /^[\d\s\+\-\(\)]{10,}$/.test(v.trim()) ? '' : 'Введите корректный номер телефона',
      address: v => v.trim().length >= 10 ? '' : 'Введите полный адрес доставки',
    };

    // Валидация в реальном времени при потере фокуса
    Object.keys(validators).forEach(field => {
      document.addEventListener('focusout', e => {
        if (e.target && e.target.id === field) validateField(field);
      });
    });

    function validateField(field) {
      const input = document.getElementById(field);
      const errEl = document.getElementById(`err-${field}`);
      if (!input || !errEl) return true;
      const err = validators[field](input.value);
      errEl.textContent = err;
      input.classList.toggle('error', !!err);
      return !err;
    }

    function handleSubmit(e) {
      e.preventDefault();

      // Валидируем все поля
      const allValid = Object.keys(validators).every(f => validateField(f));
      if (!allValid) {
        showToast('Пожалуйста, заполните все обязательные поля', '⚠️');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Оформляем заказ...';

      // Имитация отправки заказа
      setTimeout(() => {
        Cart.clear();
        document.getElementById('cart-content').style.display = 'none';
        document.getElementById('success-msg').classList.add('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 1200);
    }

    renderCart();
  </script>
</body>
</html>
